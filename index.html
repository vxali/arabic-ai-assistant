
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ذكاء AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#10101b;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:20px;
 background:#19192a;
 border-bottom:1px solid #333;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{font-size:23px;font-weight:bold;color:#b68aff}
main{
 max-width:750px;
 margin:auto;
 padding:25px 16px;
}
h1{text-align:center;margin-top:65px;font-size:30px}
.sub{text-align:center;color:#aaa;margin-bottom:35px}
#chat{
 min-height:200px;
 padding:10px 0;
}
.msg{
 padding:14px;
 border-radius:14px;
 margin:12px 0;
 line-height:1.8;
 max-width:90%;
}
.user{background:#6335a7;margin-right:auto}
.bot{background:#24243a;margin-left:auto}
.input-area{
 position:sticky;
 bottom:0;
 background:#10101b;
 padding:12px 0;
 display:flex;
 gap:8px;
}
input{
 flex:1;
 min-width:0;
 padding:16px;
 border-radius:14px;
 border:1px solid #444;
 background:#202033;
 color:white;
 font-size:16px;
}
button{
 border:0;
 border-radius:13px;
 background:#9657e8;
 color:white;
 padding:0 20px;
 font-size:16px;
}
footer{text-align:center;color:#777;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
 <div class="logo">✦ ذكاء AI</div>
 <div>مساعدك الذكي</div>
</header>
<main>
 <h1>أهلاً بك 👋</h1>
 <p class="sub">ماذا تريد أن تعرف اليوم؟</p>
 <div id="chat"></div>
 <div class="input-area">
  <input id="question" placeholder="اكتب سؤالك هنا...">
  <button onclick="send()">إرسال</button>
 </div>
</main>
<footer>ذكاء AI © 2026</footer>
<script>
function send(){
 const input=document.getElementById("question");
 const chat=document.getElementById("chat");
 const q=input.value.trim();
 if(!q)return;
 chat.innerHTML += '<div class="msg user"></div>';
 chat.lastElementChild.textContent=q;
 chat.innerHTML += '<div class="msg bot">أهلاً بك! هذه نسخة تجريبية من ذكاء AI. سيتم ربط محرك الذكاء الاصطناعي الحقيقي قريباً.</div>';
 input.value="";
}
document.getElementById("question").addEventListener("keydown",e=>{
 if(e.key==="Enter")send();
});
</script>
</body>
</html>
